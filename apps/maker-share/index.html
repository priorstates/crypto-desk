<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maker Share</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="ms-page">
  <header class="ms-top">
    <div>
      <h1 data-t="title"></h1>
      <p class="ms-sub" id="sub"></p>
    </div>
    <span class="ms-paper" data-t="paper"></span>
  </header>

  <p id="notice" class="ms-notice" hidden></p>

  <div class="ms-tiles" id="tiles"></div>

  <div class="ms-grid">
    <section class="ms-card ms-chartcard">
      <h2 id="chartTitle"></h2>
      <div class="ms-chart" id="chart" role="img"></div>
      <div class="ms-empty" id="empty" hidden></div>
    </section>
    <section class="ms-card ms-tablecard">
      <table class="ms-table">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot><tr id="tfoot"></tr></tfoot>
      </table>
    </section>
  </div>

  <p class="ms-foot" id="foot"></p>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
