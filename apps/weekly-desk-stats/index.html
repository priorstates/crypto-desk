<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Week</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1 data-t="title">Desk Week</h1>
      <span class="badge" data-t="paper">Paper only</span>
    </div>
    <p id="sub" class="sub">&nbsp;</p>
  </header>

  <section id="cards" class="cards" aria-live="polite"></section>

  <section id="empty" class="empty" hidden>
    <b data-t="emptyTitle"></b>
    <p data-t="emptyBody"></p>
  </section>

  <section id="board" class="board" hidden>
    <div class="row head">
      <span data-t="day"></span>
      <span data-t="pnl"></span>
      <span data-t="fills"></span>
      <span>1 s</span><span>5 s</span><span>30 s</span>
      <span data-t="breaches"></span>
      <span data-t="stale"></span>
    </div>
    <div id="rows"></div>
  </section>

  <div id="notes" class="foot"></div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
